[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanistico"
version = "0.1.0"
description = "Extração e avaliação de parâmetros urbanísticos da lei de uso do solo de Londrina com LLM"
readme = "README.md"
requires-python = ">=3.13"
# Faixas compatíveis; as versões exatas do ambiente ficam no requirements.txt.
dependencies = [
    "google-genai>=3.0,<4",
    "pydantic>=2.14,<3",
    "pymupdf>=2.1,<3",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "ruff>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
